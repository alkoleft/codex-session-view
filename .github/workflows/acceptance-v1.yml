name: acceptance-v1

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - v1
      - implementation-orchestrator/**

jobs:
  acceptance-v1:
    name: acceptance-v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run acceptance-v1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/acceptance_v1.py \
            --manifest tests/acceptance/manifest.json \
            --doc docs/parity/acceptance-v1.md \
            --report target/acceptance-v1/report.json

      - name: Upload acceptance-v1 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-v1-report
          path: target/acceptance-v1/report.json
          if-no-files-found: ignore

      - name: Примечание о branch protection
        run: |
          echo "acceptance-v1 валидирует acceptance-контракт и выполняет runtime acceptance-набор."
          echo "Политика required-check задаётся во внешней branch protection GitHub и не может быть проверена из этого workspace (нет доступа к remote/config)."
