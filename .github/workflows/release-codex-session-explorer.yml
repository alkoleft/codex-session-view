name: release-codex-session-explorer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-codex-session-explorer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            platform: ubuntu-22.04
            args: "--features desktop"
          - name: windows-x64
            platform: windows-latest
            args: "--features desktop"
          - name: macos-aarch64
            platform: macos-latest
            args: "--features desktop --target aarch64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/codex-session-explorer/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/codex-session-explorer/src-tauri -> target"

      - name: Install frontend dependencies
        run: npm --prefix apps/codex-session-explorer ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/codex-session-explorer
          tagName: ${{ github.ref_name }}
          releaseName: "codex-session-explorer ${{ github.ref_name }}"
          releaseBody: "Черновик релиза с автособранными bundle-артефактами `codex-session-explorer`."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build portable artifact metadata
        id: portable
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            ubuntu-22.04)
              echo "artifact_name=codex-session-explorer-${{ github.ref_name }}-linux-x64-portable.tar.gz" >> "$GITHUB_OUTPUT"
              echo "artifact_path=target/release/codex-session-explorer" >> "$GITHUB_OUTPUT"
              ;;
            windows-latest)
              echo "artifact_name=codex-session-explorer-${{ github.ref_name }}-windows-x64-portable.zip" >> "$GITHUB_OUTPUT"
              echo "artifact_path=target/release/codex-session-explorer.exe" >> "$GITHUB_OUTPUT"
              ;;
            macos-latest)
              echo "artifact_name=codex-session-explorer-${{ github.ref_name }}-macos-aarch64-portable.zip" >> "$GITHUB_OUTPUT"
              echo "artifact_path=target/aarch64-apple-darwin/release/bundle/macos/codex-session-explorer.app" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Package portable artifact
        shell: bash
        run: |
          mkdir -p portable-dist
          artifact_name="${{ steps.portable.outputs.artifact_name }}"
          artifact_path="${{ steps.portable.outputs.artifact_path }}"

          if [ ! -e "$artifact_path" ]; then
            echo "Portable source not found: $artifact_path" >&2
            exit 1
          fi

          case "${{ matrix.platform }}" in
            ubuntu-22.04)
              tar -C "$(dirname "$artifact_path")" -czf "portable-dist/$artifact_name" "$(basename "$artifact_path")"
              ;;
            windows-latest)
              powershell -NoProfile -Command "Compress-Archive -Path '$artifact_path' -DestinationPath 'portable-dist/$artifact_name' -Force"
              ;;
            macos-latest)
              ditto -c -k --sequesterRsrc --keepParent "$artifact_path" "portable-dist/$artifact_name"
              ;;
          esac

      - name: Upload portable artifact to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "portable-dist/${{ steps.portable.outputs.artifact_name }}" --clobber
