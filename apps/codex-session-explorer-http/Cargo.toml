[package]
name = "codex-session-explorer-http"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
codex-log = { path = "../../crates/codex-log" }
codex-session-explorer-backend = { path = "../../crates/codex-session-explorer-backend" }
include_dir = "0.7"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.12"
tower = { version = "0.5", features = ["util"] }
