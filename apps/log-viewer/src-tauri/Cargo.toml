[package]
name = "log-viewer"
version = "0.1.0"
edition = "2021"

[features]
default = []
desktop = ["dep:tauri"]

[lib]
name = "log_viewer"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "log-viewer"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codex-log = { path = "../../../crates/codex-log" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3.12"
