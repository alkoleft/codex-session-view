[package]
name = "codex-log-viewer"
version = "0.1.0"
edition = "2021"

[features]
default = []
desktop = ["dep:tauri"]

[lib]
name = "codex_log_viewer"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-log-viewer"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codex-log = { path = "../../../crates/codex-log" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3.12"
