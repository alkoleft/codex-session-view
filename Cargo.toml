[workspace]
members = [
    "crates/codex-log",
    "apps/codex-log-viewer/src-tauri",
    "apps/codex-log-viewer-tauri-ui/src-tauri",
]

[package]
name = "codex-worker-rs"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "codex-worker"
path = "src/main.rs"

[[bin]]
name = "events_tree_html"
path = "src/bin/events_tree_html.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
codex-log = { path = "crates/codex-log" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["clock"] }
regex = "1.11"
sha2 = "0.10"
tempfile = "3.12"
libc = "0.2"
